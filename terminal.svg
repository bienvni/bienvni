font-weight="400" opacity="0">science because they are the foundation.  I explore the intersection of physical<animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="2.1s" fill="freeze" /></tspan><tspan x="24" y="208" fill="#e6edf3" font-weight="400" opacity="0">engineering (general electricity, electronics, automation, smart grids) and<animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="2.45s" fill="freeze" /></tspan><tspan x="24" y="228" fill="#e6edf3" font-weight="400" opacity="0">digital engineering (software development, data science, artificial intelligence,<animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="2.8s" fill="freeze" /></tspan><tspan x="24" y="248" fill="#e6edf3" font-weight="400" opacity="0">and cybersecurity)  with the long-term ambition of building a multi-sector<animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="3.15s" fill="freeze" /></tspan><tspan x="24" y="268" fill="#e6edf3" font-weight="400" opacity="0">technology industry<animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="3.5s" fill="freeze" /></tspan><tspan x="24" y="288" fill="#e6edf3" font-weight="400" opacity="0"> <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="3.85s" fill="freeze" /></tspan><tspan x="24" y="308" fill="#ffa657" font-weight="600" opacity="0">&gt; education:<animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="4.2s" fill="freeze" /></tspan><tspan x="24" y="328" fill="#e6edf3" font-weight="400" opacity="0">I completed my primary and secondary education in 2025 with a state diploma. In<animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="4.55s" fill="freeze" /></tspan><tspan x="24" y="348" fill="#e6edf3" font-weight="400" opacity="0">secondary school, I studied the technical option: general electricity, and at the<animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="4.9s" fill="freeze" /></tspan><tspan x="24" y="368" fill="#e6edf3" font-w